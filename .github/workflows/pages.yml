# Deploys the site to GitHub Pages on every push to main.
# Stamps the commit ID into sw.js so phones always pick up the update.
# Requires: repo Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check sound files
        run: node sw.test.js
      - name: Stamp version
        run: |
          sed -i "s/^const VERSION = .*/const VERSION = '${GITHUB_SHA::7}';/" sw.js
          grep -q "const VERSION = '${GITHUB_SHA::7}';" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
